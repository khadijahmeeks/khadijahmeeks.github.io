
<!DOCTYPE HTML>
<html>
    <head>
        <title>Images</title>
        <style>
            body {
                background: #fa8bb0;
                color: #fff;
                font-family: "Helvetica Neue", Arial, sans-serif;
                font-size: 20px;
                margin: 0;
                padding: 0;
            }
            #all-contents {
                max-width: 1200px;
                margin: 0 auto;
                padding: 0 24px;
            }
            nav {
                background:#fff;
                display: flex;
                align-items: center;
                padding: 16px 32px;
                border-radius: 16px;
                margin: 32px 0 24px 0;
                box-shadow: 0 2px 16px 0 #fa8bb0;
            }
            h1 {
                flex: 1;
                margin: 0;
                font-weight: 600;
                font-size: 2.5rem;
                color: #a52f56;
                letter-spacing: -1px;
                
            }
            #nav-ul {
                list-style: none;
                margin: 0;
                padding: 0;
                display: flex;
                gap: 16px;
            }
            .nav-li {
                display: inline-block;
            }
            #navanchor {
                text-decoration: none;
                color: #a52f56;
                font-weight: 500;
                transition: color 0.4s;
                
            }
            #navanchor:hover {
                color: #fff;
                background-color:#a52f56;
                padding: 7px;
                border-radius: 12px;
            }
            .image-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 32px;
                margin-top: 32px;
            }
            .image-item {
                
                transition: transform 0.2s;
                display: flex;
                align-item: center;
                justify-content: center;
                padding: 16px;
            }
            .image-item img {
                max-width: 110%;
                max-height: 320px;
                border-radius: 12px;
                background: #18120f;
                border: 4px solid #a52f56;
                transition: box-shadow 0.2s, border-color 0.2s, transform 0.2s;
            }
            .image-item img:hover {
                transform: scale(1.08);
            }
            @media (max-width: 900px) {
                .image-grid {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
            @media (max-width: 600px) {
                .image-grid {
                    grid-template-columns: 1fr;
                }
            }
    </style>
    </head>
    
    <body>
        <div id="all-contents">
            <nav>
                <h1>images</h1>
                <ul id="nav-ul">
                    <li class="nav-li">
                        <a id="navanchor" href="index.html">home</a>
                    </li>
                    <li class="nav-li">
                        <a id="navanchor" href="portfolio.html">portfolio</a>
                        </li>
                    <li class="nav-li"><a id="navanchor" href="images.html">images</a>
                    </li>
                    
                </ul>
            </nav>
                <div class="image-grid">
                    <div class="image-item"><img src="assets/IMG_6469.JPG" alt="IMG_3215"></div>
                    
                    <div class="image-item"><img src="assets/IMG_6465.JPG" ></div>
                    <div class="image-item"><img src="assets/IMG_6466.JPG" ></div>
                    <div class="image-item"><img src="assets/IMG_6467.JPG" ></div>
                    <div class="image-item"><img src="assets/IMG_6468.JPG" ></div>
                </div>
                <!-- Modal for full-size image -->
                <div id="imageModal" class="modal">
                    <span class="close">&times;</span>
                    <span class="modal-arrow left">&#10094;</span>
                    <img class="modal-content" id="modalImg" alt="Full Size">
                    <span class="modal-arrow right">&#10095;</span>
                </div>
    </body>
      
      
      
      
      
      
      
        <script>
        // Modal logic with navigation
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const closeBtn = document.querySelector('.close');
        const leftArrow = document.querySelector('.modal-arrow.left');
        const rightArrow = document.querySelector('.modal-arrow.right');
        const images = Array.from(document.querySelectorAll('.image-item img'));
        let currentIndex = 0;

        function showModal(index) {
            currentIndex = index;
            modal.style.display = 'block';
            modalImg.src = images[index].src;
            modalImg.alt = images[index].alt;
        }

        images.forEach((img, idx) => {
            img.addEventListener('click', function() {
                showModal(idx);
            });
        });

        closeBtn.onclick = function() {
            modal.style.display = 'none';
            modalImg.src = '';
        }

        leftArrow.onclick = function(e) {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            showModal(currentIndex);
        }

        rightArrow.onclick = function(e) {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % images.length;
            showModal(currentIndex);
        }

        window.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
                modalImg.src = '';
            }
        }

        window.addEventListener('keydown', function(e) {
            if (modal.style.display === 'block') {
                if (e.key === 'ArrowLeft') {
                    currentIndex = (currentIndex - 1 + images.length) % images.length;
                    showModal(currentIndex);
                } else if (e.key === 'ArrowRight') {
                    currentIndex = (currentIndex + 1) % images.length;
                    showModal(currentIndex);
                } else if (e.key === 'Escape') {
                    modal.style.display = 'none';
                    modalImg.src = '';
                }
            }
        });
        </script>
        <style>
            .modal {
                display: none;
                position: fixed;
                z-index: 1000;
                left: 0;
                top: 0;
                width: 100vw;
                height: 100vh;
                overflow: auto;
                animation: fadeIn 0.3s;
            }
            .modal-content {
                display: block;
                margin: 5vh auto;
                max-width: 90vw;
                max-height: 80vh;
                border-radius: 18px;
                box-shadow: 0 8px 32px 0 rgba(57,255,20,0.32);
                background: #18120f;
                border: 6px solid #39ff14;
                animation: scaleUp 0.3s;
            }
            .close {
                position: absolute;
                top: 32px;
                right: 48px;
                color: #39ff14;
                font-size: 48px;
                font-weight: 300;
                cursor: pointer;
                z-index: 1001;
                transition: color 0.2s;
                text-shadow: 2px 2px 8px #000;
            }
            .close:hover {
                color: #fff;
            }
            .modal-arrow {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                color: #39ff14;
                font-size: 64px;
                font-weight: 300;
                cursor: pointer;
                z-index: 1001;
                user-select: none;
                padding: 0 24px;
                transition: color 0.2s;
                text-shadow: 2px 2px 8px #000;
            }
            .modal-arrow.left {
                left: 0;
            }
            .modal-arrow.right {
                right: 0;
            }
            .modal-arrow:hover {
                color: #fff;
            }
            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            @keyframes scaleUp {
                from { transform: scale(0.95); }
                to { transform: scale(1); }
            }
        </style>
</html>
